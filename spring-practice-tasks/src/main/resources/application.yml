spring:
  application:
    name: spring-practice-tasks
  datasource:
    url: jdbc:postgresql://localhost:5555/practice_tasks
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8585
  servlet:
    context-path: /spt-api

logging:
  pattern:
    console:
      "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId}] %-5level - %msg%n"
  level:
    org:
      hibernate:
        SQL: DEBUG


management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: spring-practice-tasks